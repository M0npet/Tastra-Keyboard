# Build and run the full test suite on Arch Linux (same Qt 6 as the target
# tablet). Offscreen Qt platform: no display or compositor needed.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git base-devel cmake ninja pkgconf python \
            qt6-base qt6-declarative qt6-wayland qt6-svg \
            wayland wayland-protocols libxkbcommon hunspell ttf-dejavu
      - uses: actions/checkout@v4
      - name: Static checks
        run: python3 scripts/verify-static.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
